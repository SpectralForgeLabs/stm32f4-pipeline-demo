name: Kubernetes Runner Tests

on:
  push:
    branches:
      - "test/*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  tests:
    runs-on: [spectral-k3s]
    container:
      image: registry.spectralforge.dev/unity:2.6.1

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          cmake -S tests -B tests/build -G Ninja
          ninja -C tests/build

      - name: Run tests
        run: |
          ctest --test-dir tests/build -V --output-junit results.xml

      - name: Publish results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Unity Report
          path: tests/build/results.xml
          reporter: java-junit